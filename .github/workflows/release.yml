name: release

# タグ（例: v0.1.0）を push すると、Windows 用（hotrun-app.exe と hotrun.exe の zip）をビルドして
# GitHub Releases に「下書き」で置く。内容を確認してから Publish する。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/tests-ui/package-lock.json

      - name: Test UI
        working-directory: app/tests-ui
        run: |
          npm ci
          npm test
          npm run test:dom

      - name: Build
        run: cargo build --release -p hotrun-app -p hotrun

      - name: Package
        shell: pwsh
        run: |
          $name = "HotRun-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item target/release/hotrun-app.exe, target/release/hotrun.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: HotRun-*-windows-x64.zip

  release:
    needs: [windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: 'HotRun ${{ github.ref_name }}'
          body: 'zip を展開して hotrun-app.exe を実行（設定画面とタスクトレイ常駐）。hotrun.exe はコマンドライン版。使い方は README を参照。'
          files: dist/**/*
