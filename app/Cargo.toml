[package]
name = "hotrun-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hotrun-app"
path = "src/main.rs"

[features]
# 画面(Tauri)。Linux 上でロジックだけテストするときは --no-default-features
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-build"]

[dependencies]
hotrun-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.1", features = ["custom-protocol", "tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2.8.1", optional = true }
tauri-plugin-single-instance = { version = "2.5.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2.7.1", optional = true }
