<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HotRun - 使用中のキー一覧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <button id="btnRescan" class="primary">再スキャン</button>
    <button id="btnProbe" title="調べたいキーを押すと、誰かが取っているか分かります">押して確認</button>
    <input type="text" id="filter" placeholder="キーで絞り込み（例: ctrl+shift, F19）" spellcheck="false">
    <div class="spacer"></div>
    <span id="summary" class="dim"></span>
  </header>

  <div class="banner">キーは押していません（登録を試して、断られたキーを集めています）。持ち主は Windows からは分からないので、気になるキーは実際に押して確かめてください（そのアプリの動作が実行されます）。</div>
  <div id="probe" class="banner" hidden></div>
  <div id="mine" class="banner error" hidden></div>
  <div id="error" class="banner error" hidden></div>

  <main class="page" id="groups"></main>

  <script src="common.js"></script>
  <script src="scan.js"></script>
</body>
</html>
